name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build package and Pages output
        run: npm run build

      - name: Verify committed Pages output
        run: git diff --exit-code -- docs

      - name: Inspect npm package dry run
        run: npm pack --dry-run

      - name: Verify installed tarball imports
        run: npm run package:verify
